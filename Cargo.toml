[package]
name = "helm-forge"
version = "0.1.3"
edition = "2024"
rust-version = "1.89.0"
description = "Helm chart generator backend for iac-forge"
homepage = "https://github.com/pleme-io/helm-forge"
repository = "https://github.com/pleme-io/helm-forge"
license = "MIT"
categories = ["development-tools"]
keywords = ["helm", "kubernetes", "codegen", "openapi", "iac"]

[lints.clippy]
pedantic = "warn"

[dependencies]
iac-forge = { version = "0.1", optional = true }
schemars = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = { version = "0.9", optional = true }

[features]
default = ["backend"]
backend = ["dep:iac-forge", "dep:serde_norway"]
values-schema = ["dep:schemars"]

[[test]]
name = "integration"
required-features = ["backend"]

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
